<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alles muss raus: Wohnungsauflösung in Berlin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EEF1F0; --card:#FFFFFF; --ink:#15213B; --muted:#586377; --line:#D3D9DE;
  --flyer:#FFE94A; --flyer-ink:#15213B; --mark:#FFE94A; --mark-ink:#15213B;
  --now:#157A4E; --later:#2A55C7; --gone:#7B8494; --stage:#0E1522;
  --display:"Bricolage Grotesque","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0F141E; --card:#19202E; --ink:#EDF0F5; --muted:#A3ACBC; --line:#2B3446;
    --now:#4CC68C; --later:#93B2FF; --gone:#8791A3; --stage:#070A11;
  }
}
:root[data-theme="dark"]{
  --page:#0F141E; --card:#19202E; --ink:#EDF0F5; --muted:#A3ACBC; --line:#2B3446;
  --now:#4CC68C; --later:#93B2FF; --gone:#8791A3; --stage:#070A11;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--later);outline-offset:2px}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}

/* top bar */
.top{display:flex;justify-content:flex-end;padding:.75rem 0}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:.3rem .8rem;font-weight:600;font-size:.875rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--page)}

/* the flyer */
.flyer{background:var(--flyer);color:var(--flyer-ink);border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.18),0 14px 30px -18px rgba(10,20,40,.55)}
.flyer-body{padding:1.5rem 1.25rem 1.25rem}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.9rem,13vw,6.5rem);line-height:.9;letter-spacing:-.035em;margin:0 0 1rem;font-variation-settings:"opsz" 96}
.lead{font-size:1.125rem;line-height:1.45;max-width:38rem;margin:0 0 1.25rem;font-weight:500}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;max-width:40rem;font-size:.95rem}
.legend li{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:start}
.legend b{font-weight:600}
.dot{width:.7rem;height:.7rem;border-radius:50%;display:inline-block;flex:none;margin-top:.4rem}
.flyer .dot{box-shadow:0 0 0 2px var(--flyer-ink)}
.dot.now{background:#18A368}.dot.later{background:#3D6BE8}.dot.reserved{background:#E08A1E}.dot.sold{background:var(--gone)}

/* tear-off strip: category filter */
.strip{display:flex;border-top:2px dashed var(--flyer-ink)}
.strip button{flex:1 1 0;min-width:0;height:7.25rem;border:0;border-left:2px dashed var(--flyer-ink);background:transparent;color:var(--flyer-ink);padding:.5rem 0;display:flex;align-items:center;justify-content:center}
.strip button:first-child{border-left:0}
.strip span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em;white-space:nowrap}
.strip button[aria-pressed="true"]{background:var(--flyer-ink);color:var(--flyer)}
.strip button:hover:not([aria-pressed="true"]){background:rgba(21,33,59,.1)}
.strip button:focus-visible{outline-offset:-4px;outline-color:var(--flyer-ink)}
.strip button[aria-pressed="true"]:focus-visible{outline-color:var(--flyer)}

/* availability filter */
.bar{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;justify-content:space-between;margin:1.5rem 0 1rem}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.4rem .85rem;font-size:.9rem;font-weight:500;display:inline-flex;align-items:center;gap:.45rem}
.seg button .dot{margin:0}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--page)}
.count{color:var(--muted);font-size:.9rem;margin:0}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;list-style:none;margin:0;padding:0}
@media (min-width:44rem){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}}
@media (min-width:64rem){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:1.25rem}}
.item{background:var(--card);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.item button{all:unset;cursor:pointer;display:flex;flex-direction:column;height:100%;width:100%}
.item button:focus-visible{outline:3px solid var(--later);outline-offset:-3px}
.ph{position:relative;aspect-ratio:4/5;background:var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.more{position:absolute;right:.4rem;bottom:.4rem;background:rgba(14,21,34,.78);color:#fff;font-size:.75rem;font-weight:600;padding:.1rem .45rem;border-radius:999px}
.stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,21,34,.5)}
.stamp span{font-family:var(--display);font-weight:800;font-size:1.4rem;color:#fff;border:3px solid #fff;padding:.1rem .7rem;transform:rotate(-8deg);border-radius:4px}
.item.is-sold .ph img{filter:grayscale(1)}
.meta{padding:.65rem .7rem .8rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.no{font-size:.78rem;color:var(--muted);font-weight:500}
.name{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.2;margin:0}
.price{align-self:flex-start;background:var(--mark);color:var(--mark-ink);font-family:var(--display);font-weight:800;font-size:1.05rem;padding:.05rem .4rem;border-radius:2px;margin-top:.1rem}
.price small{font-weight:500;font-size:.75rem}
.is-sold .price{text-decoration:line-through;background:transparent;color:var(--muted);padding-left:0}
.st{display:flex;gap:.4rem;align-items:flex-start;font-size:.82rem;color:var(--muted);margin-top:auto;padding-top:.25rem;line-height:1.3}
.st .dot{width:.6rem;height:.6rem;margin-top:.25rem}
.empty{grid-column:1/-1;padding:2rem 0;color:var(--muted)}

/* info */
.info{margin:3rem 0 2rem;display:grid;gap:1.5rem}
@media (min-width:52rem){.info{grid-template-columns:1fr 1fr;gap:3rem}}
.info h2{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1;letter-spacing:-.01em;margin:0 0 .75rem}
.info p{margin:0 0 .75rem;max-width:34rem}
.fine{color:var(--muted);font-size:.875rem}
footer{padding:0 0 2.5rem}

/* detail dialog */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:min(44rem,100%);max-width:100%;max-height:100%;border-radius:8px;overflow:auto}
dialog::backdrop{background:rgba(7,10,17,.72)}
@media (max-width:44rem){dialog{width:100%;height:100%;border-radius:0;margin:0;max-height:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.stage{position:relative;background:var(--stage)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 100%;margin:0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;height:min(62vh,34rem)}
.gal img{max-height:100%;max-width:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#15213B;font-size:1.3rem;line-height:1;display:flex;align-items:center;justify-content:center}
.nav.prev{left:.6rem}.nav.next{right:.6rem}
.nav[hidden]{display:none}
.pos{position:absolute;left:50%;bottom:.6rem;transform:translateX(-50%);background:rgba(14,21,34,.78);color:#fff;font-size:.8rem;font-weight:600;padding:.1rem .6rem;border-radius:999px}
.close{position:absolute;top:.6rem;right:.6rem;width:2.6rem;height:2.6rem;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#15213B;font-size:1.5rem;line-height:1;display:flex;align-items:center;justify-content:center}
.sheet{padding:1.1rem 1.25rem 1.5rem}
.sheet .no{font-size:.875rem}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;margin:.15rem 0 .6rem;letter-spacing:-.01em}
.sheet .row{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin-bottom:.9rem}
.sheet .price{font-size:1.35rem;margin:0}
.sheet .st{margin:0;padding:0;font-size:.95rem;color:var(--ink);align-items:center}
.sheet .st .dot{margin:0;width:.7rem;height:.7rem}
.sheet p{margin:0 0 .8rem;max-width:36rem}
.how{border-top:1px solid var(--line);padding-top:.9rem;margin-top:1rem;color:var(--muted);font-size:.95rem}
.how strong{color:var(--ink)}
.sheet a{color:var(--later);font-weight:600}
.cta{display:inline-block;background:var(--ink);color:var(--page)!important;font-weight:600;text-decoration:none;padding:.7rem 1.3rem;border-radius:999px;margin:0 0 .6rem}
.how .cta{display:block;text-align:center;max-width:22rem}
@media (prefers-reduced-motion:no-preference){.gal{scroll-behavior:smooth}}
</style>
</head>

      </ul>
    </div>
    <nav class="strip" id="cats" aria-label="Kategorien"></nav>
  </header>

  <main>
    <div class="bar">

        <p data-t="how3"></p>

      <div>
        <h2 data-t="goodTitle"></h2>
        <p data-t="good1"></p>
        <p data-t="good2"></p>
        <p class="fine" data-t="fine"></p>
        <p class="fine" data-t="privacy"></p>

    </section>
  </main>

  <footer><p class="fine" data-t="updated"></p></footer>
</div>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="stage">
    <div class="gal" id="gal" tabindex="0"></div>

    <button type="button" class="nav next" id="next" aria-label="Nächstes Foto">&#8250;</button>
    <span class="pos" id="pos"></span>
    <button type="button" class="close" id="close" aria-label="Schließen">&times;</button>
  </div>
  <div class="sheet">
    <span class="no" id="dNo"></span>
    <h2 id="dTitle"></h2>
    <div class="row"><span class="price" id="dPrice"></span><span class="st" id="dSt"></span></div>
    <p id="dDesc"></p>
    <p id="dLink"></p>
    <p class="how" id="dHow"></p>
  </div>
</dialog>

/* Request form (Google Form). The item button fills the message with "#<number> <English title> / <German title>: ". */
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSdIlmK7XPM_Rsx1PgjSR-jbQqa2_mL7N6Wypbrbvw32nTTGXQ/viewform";
const formLink = it => it ? `${FORM}?usp=pp_url&entry.1976189261=${encodeURIComponent(`#${it.n} ${it.en.t} / ${it.de.t}: `)}` : FORM;

/* Photos live in ./img as <id>.jpg */
const IMG = new Proxy({}, {get: (_, id) => `img/${String(id)}.jpg`});

let lang = (navigator.language||"de").toLowerCase().startsWith("de") ? "de" : "en";
let cat = "all", av = "all";
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const priceHTML = it => `${it.from ? T[lang].from+" " : ""}${it.price}&nbsp;€${it.from ? "" : ` <small>${T[lang].vb}</small>`}`;

function renderStatic(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(el => {
    const k = el.dataset.t;
    el.textContent = k === "updated" ? t.updated + UPDATED[lang] + "." : t[k];
  });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#cats").setAttribute("aria-label", t.cats);
  $("#cats").innerHTML = CATS.map(([id,l]) => `<button type="button" data-cat="${id}" aria-pressed="${id===cat}"><span>${l[lang]}</span></button>`).join("");
  $("#avail").setAttribute("aria-label", t.avail);
  $("#avail").innerHTML = [["all",t.avAll,""],["now",t.avNow,"now"],["later",t.avLater,"later"]]
    .map(([id,l,d]) => `<button type="button" data-av="${id}" aria-pressed="${id===av}">${d?`<span class="dot ${d}"></span>`:""}${l}</button>`).join("");
  $("#prev").setAttribute("aria-label", t.prev);
  $("#next").setAttribute("aria-label", t.next);
  $("#close").setAttribute("aria-label", t.close);
}

function renderGrid(){
  const t = T[lang];
  const list = ITEMS.filter(it => (cat==="all"||it.cat===cat) && (av==="all"||it.st===av));
  $("#count").textContent = t.count(list.length, ITEMS.length);
  $("#grid").innerHTML = list.length ? list.map(it => {
    const gone = it.st==="sold"||it.st==="reserved";
    return `<li class="item ${it.st==="sold"?"is-sold":""}"><button type="button" data-n="${it.n}" aria-label="${esc(it[lang].t)}, ${t.no} ${it.n}">
      <div class="ph"><img loading="lazy" decoding="async" alt="" src="${IMG[it.img[0]]||""}">
        ${it.img.length>1?`<span class="more">${it.img.length} ${t.photos}</span>`:""}
        ${gone?`<span class="stamp"><span>${t.st[it.st]}</span></span>`:""}</div>
      <div class="meta"><span class="no">${t.no} ${it.n}</span><h3 class="name">${esc(it[lang].t)}</h3>
        <span class="price">${priceHTML(it)}</span>
        <span class="st"><span class="dot ${it.st}"></span><span>${t.st[it.st]}</span></span></div>
    </button></li>`;}).join("") : `<li class="empty">${t.empty}</li>`;
}

let current = null;
function openItem(n){
  const it = ITEMS.find(x => x.n === n); if(!it) return;
  current = it; const t = T[lang];
  $("#gal").innerHTML = it.img.map((id,i) => `<figure><img alt="${esc(it[lang].t)} (${i+1}/${it.img.length})" src="${IMG[id]||""}"></figure>`).join("");
  $("#dNo").textContent = `${t.no} ${it.n}`;
  $("#dTitle").textContent = it[lang].t;
  $("#dPrice").innerHTML = priceHTML(it);
  $("#dSt").innerHTML = `<span class="dot ${it.st}"></span><span>${t.st[it.st]}</span>`;
  $("#dDesc").textContent = it[lang].d;
  const links = [].concat(it.link || []).map(l => typeof l === "string" ? {url: l} : l);
  const a = (u, label) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)}&nbsp;↗</a>`;
  $("#dLink").innerHTML = links.length === 1 ? a(links[0].url, t.link)
    : links.length ? `${t.links} ` + links.map(l => a(l.url, l[lang] || new URL(l.url).hostname)).join(" · ") : "";
  $("#dLink").hidden = !links.length;
  $("#dHow").innerHTML = (it.st === "now" || it.st === "later")
    ? `<a class="cta" href="${formLink(it)}" target="_blank" rel="noopener noreferrer">${t.request}</a>${t.dHow}`
    : t.taken;
  const dlg = $("#dlg");
  if(!dlg.open) dlg.showModal();
  $("#gal").scrollLeft = 0; dlg.scrollTop = 0;
  updatePos();
}
function galIndex(){ const g = $("#gal"); return Math.round(g.scrollLeft / Math.max(1,g.clientWidth)); }
function updatePos(){
  if(!current) return; const n = current.img.length, i = Math.min(n-1, galIndex());
  $("#pos").textContent = `${i+1} / ${n}`; $("#pos").hidden = n < 2;
  $("#prev").hidden = n < 2 || i === 0; $("#next").hidden = n < 2 || i === n-1;
}
function step(d){ const g = $("#gal"); g.scrollBy({left: d*g.clientWidth, behavior: "auto"}); setTimeout(updatePos, 60); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.lang){ lang = b.dataset.lang; renderStatic(); renderGrid(); if($("#dlg").open && current) openItem(current.n); }
  else if(b.dataset.cat){ cat = b.dataset.cat; renderStatic(); renderGrid(); }
  else if(b.dataset.av){ av = b.dataset.av; renderStatic(); renderGrid(); }
  else if(b.dataset.n){ openItem(Number(b.dataset.n)); }
  else if(b.id === "close"){ $("#dlg").close(); }
  else if(b.id === "prev"){ step(-1); }
  else if(b.id === "next"){ step(1); }
});
$("#gal").addEventListener("scroll", () => requestAnimationFrame(updatePos), {passive:true});
$("#gal").addEventListener("keydown", e => { if(e.key==="ArrowRight"){step(1);e.preventDefault();} if(e.key==="ArrowLeft"){step(-1);e.preventDefault();} });
$("#dlg").addEventListener("click", e => { if(e.target === $("#dlg")) $("#dlg").close(); });

$("#formAll").href = formLink();
renderStatic(); renderGrid();
</script>
